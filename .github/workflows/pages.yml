# Publica o Aconta como site (para usar no PC) no GitHub Pages.
name: Site para o PC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Ícone do site
        run: google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=180,180 --screenshot="$PWD/www/icon-180.png" "file://$PWD/resources/icon.html" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
