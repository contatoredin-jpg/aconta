<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Aconta</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aconta">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: cockpit HUD — barra de comando lateral no PC; dock com orbe de voz no celular. Pessoal = ciano, Negócios = âmbar */
  --bg:#05080f; --bg2:#0a1020; --panel:rgba(12,19,36,.78); --panel-solid:#0c1222; --raise:rgba(255,255,255,.035);
  --line:rgba(140,190,255,.11); --line2:rgba(140,190,255,.22);
  --ink:#e9f1ff; --ink2:#a9b8d6; --muted:#6f7f9f;
  --acc:#3ae4ff; --acc-rgb:58,228,255; --acc-ink:#04131a;
  --in:#2b9fe0; --out:#e8613f; --in-text:#8fd3ff;
  --good:#3fd492; --warn:#ffc24a; --crit:#ff5468;
  --font-d:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
body.biz{ --acc:#ffb547; --acc-rgb:255,181,71; --acc-ink:#1a1003; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(var(--acc-rgb),.13), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(var(--acc-rgb),.08), transparent 60%),
    linear-gradient(rgba(140,190,255,.035) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg, rgba(140,190,255,.035) 1px, transparent 1px) 0 0/44px 44px;
  transition:background .6s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:260px 1fr}
.side{height:100%;display:flex;flex-direction:column;gap:22px;padding:24px 18px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,16,32,.9),rgba(6,10,20,.85));backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:.08em}
.logo svg{flex:none;filter:drop-shadow(0 0 8px rgba(var(--acc-rgb),.7))}
.logo small{display:block;font-family:var(--font-m);font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.25);gap:4px}
.seg button{padding:9px 8px;border-radius:9px;font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.seg button.on{background:rgba(var(--acc-rgb),.14);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.45),0 0 18px rgba(var(--acc-rgb),.18)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink2);font-weight:500;text-align:left;position:relative}
.nav button svg{opacity:.7}
.nav button:hover{background:var(--raise);color:var(--ink)}
.nav button.on{color:var(--ink);background:linear-gradient(90deg,rgba(var(--acc-rgb),.16),transparent)}
.nav button.on::before{content:"";position:absolute;left:-18px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.nav button.on svg{opacity:1;color:var(--acc)}
.voice-cta{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid rgba(var(--acc-rgb),.35);background:rgba(var(--acc-rgb),.07);text-align:left}
.voice-cta:hover{background:rgba(var(--acc-rgb),.12)}
.voice-cta .mini-orb{width:40px;height:40px;flex:none}
.voice-cta b{display:block;font-family:var(--font-d);letter-spacing:.04em}
.voice-cta span{font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--font-m)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.wait{background:var(--warn);animation:blink 1.2s infinite}
.dot.local{background:var(--ink2)}
@keyframes blink{50%{opacity:.3}}

.main{height:100%;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;padding-top:calc(16px + var(--sat));border-bottom:1px solid var(--line);background:rgba(5,8,15,.55);backdrop-filter:blur(12px)}
.top .logo{display:none}
.month{display:flex;align-items:center;gap:4px;font-family:var(--font-d);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.month button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.month button:hover{background:var(--raise);color:var(--ink)}
.month span{min-width:132px;text-align:center;text-transform:capitalize}
.cmd{flex:1;display:flex;align-items:center;gap:8px;max-width:620px;margin-left:auto;padding:6px 6px 6px 14px;border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.3)}
.cmd:focus-within{border-color:rgba(var(--acc-rgb),.6);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;padding:6px 0}
.cmd input::placeholder{color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:hover{background:var(--raise);color:var(--ink)}
.icon-btn.acc{color:var(--acc-ink);background:var(--acc);box-shadow:0 0 16px rgba(var(--acc-rgb),.45)}
.chips{display:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding:26px 28px 120px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vhead h1{font-size:26px}
.vhead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px dashed rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.06);font-size:13px;color:var(--ink2)}
.banner b{color:var(--acc);font-family:var(--font-m);font-size:11px;letter-spacing:.14em}

/* ---------- blocks ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:3fr 2fr}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;backdrop-filter:blur(10px);min-width:0}
.panel.hud::after{content:"";position:absolute;top:-1px;left:18px;width:42px;height:2px;background:var(--acc);box-shadow:0 0 10px var(--acc);border-radius:2px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.ph .sub{font-size:12px;color:var(--muted);font-family:var(--font-m)}
.tile{display:flex;flex-direction:column;gap:6px}
.tile .k{font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-d);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.1;overflow-wrap:anywhere}
.tile .d{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile.main{background:linear-gradient(145deg,rgba(var(--acc-rgb),.16),rgba(12,19,36,.8) 60%);border-color:rgba(var(--acc-rgb),.35)}
.tile.main .v{color:var(--acc);text-shadow:0 0 22px rgba(var(--acc-rgb),.35)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-family:var(--font-m);letter-spacing:.04em;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(63,212,146,.4);background:rgba(63,212,146,.08)}
.pill.warn{color:var(--warn);border-color:rgba(255,194,74,.4);background:rgba(255,194,74,.08)}
.pill.crit{color:var(--crit);border-color:rgba(255,84,104,.45);background:rgba(255,84,104,.09)}
.pill.acc{color:var(--acc);border-color:rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--raise);white-space:nowrap}
.btn:hover{border-color:rgba(var(--acc-rgb),.5)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:0 0 20px rgba(var(--acc-rgb),.35)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--crit);border-color:rgba(255,84,104,.35)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line2);border-radius:12px}

.hex{width:34px;height:34px;flex:none;display:grid;place-items:center;font-family:var(--font-m);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--acc);
  clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:rgba(var(--acc-rgb),.13)}
.hex.in{color:var(--in-text);background:rgba(43,159,224,.16)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:10px;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--raise)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramt{font-weight:600;white-space:nowrap}
.ramt.in{color:var(--in-text)}
.dayh{display:flex;justify-content:space-between;padding:14px 8px 6px;font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* category bars */
.cbars{display:flex;flex-direction:column;gap:4px}
.cbar{display:grid;grid-template-columns:30px minmax(90px,170px) 1fr auto 44px;align-items:center;gap:10px;padding:6px;border-radius:9px;text-align:left;width:100%}
.cbar:hover{background:var(--raise)}
.cbar .hex{width:30px;height:30px;font-size:10px}
.cbar .cn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.05)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:linear-gradient(90deg,rgba(var(--acc-rgb),.35),var(--acc));box-shadow:0 0 10px rgba(var(--acc-rgb),.35)}
.track i.warn{background:linear-gradient(90deg,rgba(255,194,74,.35),var(--warn))}
.track i.crit{background:linear-gradient(90deg,rgba(255,84,104,.35),var(--crit))}
.track .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.75;border-radius:2px}
.cbar .cv{font-size:13px;text-align:right}
.cbar .cp{font-size:11px;color:var(--muted);text-align:right}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-m);font-size:12px;fill:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar-hit{fill:transparent;cursor:default}
.bar-hit:hover + .bar-mark, .bar-mark.hl{filter:brightness(1.25)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.card:hover{border-color:rgba(var(--acc-rgb),.45);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.15),0 10px 30px rgba(0,0,0,.35)}
.card h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.kv span{color:var(--muted)}
.prog{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);box-shadow:0 0 8px var(--acc)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-family:var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp, select.inp, textarea.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.35);outline:0;min-width:0}
.inp:focus{border-color:rgba(var(--acc-rgb),.7);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
select.inp option{background:var(--panel-solid)}
.search{max-width:280px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.tseg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tseg label{display:flex;align-items:center;justify-content:center;padding:10px;border-radius:10px;border:1px solid var(--line2);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2)}
.tseg input{position:absolute;opacity:0;pointer-events:none}
.tseg input:checked + span{color:var(--ink)}
.tseg label:has(input:checked){border-color:rgba(var(--acc-rgb),.7);background:rgba(var(--acc-rgb),.1);color:var(--ink)}
.big-amt{font-family:var(--font-d);font-size:28px !important;font-weight:600;letter-spacing:.02em}

/* ---------- mobile dock ---------- */
.dock{display:none}
.orb{position:relative;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:var(--acc-ink)}
.orb::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,var(--acc),transparent 30%,var(--acc) 50%,transparent 80%,var(--acc));animation:spin 6s linear infinite;opacity:.8;filter:blur(.5px)}
.orb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--acc) 38%,rgba(var(--acc-rgb),.6) 70%,rgba(var(--acc-rgb),.25));box-shadow:0 0 30px rgba(var(--acc-rgb),.7),inset 0 -6px 16px rgba(0,0,0,.25)}
.orb svg{position:relative;z-index:1}
.mini-orb{position:relative;border-radius:50%;display:grid;place-items:center;color:var(--acc-ink);background:radial-gradient(circle at 35% 30%,#fff 0,var(--acc) 40%,rgba(var(--acc-rgb),.5));box-shadow:0 0 16px rgba(var(--acc-rgb),.6)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb::before,.vorb .ring{animation:none!important}}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(2,4,9,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;background:linear-gradient(180deg,#0e1628,#0a1020);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(var(--acc-rgb),.08);display:flex;flex-direction:column}
.sheet.wide{width:min(860px,100%)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0e1628;z-index:2}
.sh h2{font-size:18px}
.sb{padding:20px;display:flex;flex-direction:column;gap:16px}
.sf{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#0a1020;flex-wrap:wrap}
.sf .r{display:flex;gap:10px;margin-left:auto}

/* voice */
.vstage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 4px;text-align:center}
.vorb{position:relative;width:150px;height:150px;display:grid;place-items:center}
.vorb .core{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--acc) 35%,rgba(var(--acc-rgb),.55) 70%,rgba(var(--acc-rgb),.15));box-shadow:0 0 50px rgba(var(--acc-rgb),.7);display:grid;place-items:center;color:var(--acc-ink);position:relative;z-index:2}
.vorb .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(var(--acc-rgb),.5);opacity:0}
.vorb.on .ring{animation:pulse 2.1s ease-out infinite}
.vorb.on .ring:nth-child(2){animation-delay:.7s}
.vorb.on .ring:nth-child(3){animation-delay:1.4s}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.vtext{min-height:28px;font-family:var(--font-d);font-size:20px;letter-spacing:.02em;color:var(--ink)}
.vtext.partial{color:var(--ink2)}
.vhint{font-size:13px;color:var(--muted);max-width:420px}
.vres{width:100%;display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid rgba(var(--acc-rgb),.3);border-radius:12px;background:rgba(var(--acc-rgb),.06);text-align:left;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.ex{font-family:var(--font-m);font-size:12px;color:var(--ink2);border:1px solid var(--line2);border-radius:99px;padding:4px 10px}

/* toast / tip */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 24px))}
.t{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:12px;background:#111a2e;border:1px solid rgba(var(--acc-rgb),.4);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 20px rgba(var(--acc-rgb),.12);font-size:14px;animation:pop .25s ease-out;width:100%}
.t span{flex:1}
.t button{color:var(--acc);font-weight:600;font-size:13px;padding:4px 6px}
#tip{position:fixed;z-index:90;pointer-events:none;padding:8px 10px;border-radius:9px;background:#0f1729;border:1px solid var(--line2);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-width:240px;white-space:pre-line}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g32{grid-template-columns:1fr} }
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px;padding-top:calc(12px + var(--sat));gap:8px;flex-wrap:wrap}
  .top .logo{display:flex;font-size:18px;margin-right:auto}
  .top .logo small{display:none}
  .month{order:3;width:100%;justify-content:space-between}
  .month span{flex:1}
  .cmd{display:none}

const PAY = {pix:'Pix',credito:'Crédito',debito:'Débito',dinheiro:'Dinheiro',boleto:'Boleto',transf:'Transferência'};

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ç/g,'c')}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
const IDX = {};
for (const sc of ['pessoal','negocios']) for (const ty of ['out','in']) {
  IDX[sc+ty] = CATS[sc][ty].map(c=>({c,kws:c.kw?c.kw.split('|').map(k=>({k,re:new RegExp('(^|[^a-z0-9])'+escRe(k)+(k.length<=4?'(?=$|[^a-z0-9])':''))})):[]}));
}
function catList(scope,type){return CATS[scope][type]}
function catOf(scope,type,id){return CATS[scope][type].find(c=>c.id===id)||CATS[scope][type].find(c=>c.id===DEF_CAT[scope][type])}
function learnKey(scope,type,desc){return scope+'|'+type+'|'+norm(desc).trim().replace(/\s+/g,' ')}
function classify(desc,scope,type,learned){
  const lk = learned && learned[learnKey(scope,type,desc)];
  if (lk && CATS[scope][type].some(c=>c.id===lk)) return {id:lk,sure:true};
  const t = ' '+norm(desc)+' ';
  let best=null, bs=0;
  for (const {c,kws} of IDX[scope+type]) for (const {k,re} of kws) if (k.length>bs && re.test(t)) {best=c;bs=k.length}
  return best ? {id:best.id,sure:true} : {id:DEF_CAT[scope][type],sure:false};
}

// ================= INTERPRETADOR DE VOZ / TEXTO =================
const NUMW={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};
const CUR_W = new Set(['reais','real','r$','rs','conto','contos','pila','pilas','mangos']);
const PAY_W = {pix:'pix',credito:'credito',debito:'debito',dinheiro:'dinheiro',especie:'dinheiro',boleto:'boleto',cartao:'credito',transferencia:'transf',ted:'transf'};
const DATE_W = {hoje:0,ontem:-1,anteontem:-2};
const VERB_W = new Set(['gastei','paguei','comprei','recebi','ganhei','entrou','caiu','coloquei','botei','anota','anotar','lanca','lancar','registra','registrar','gasto','gastos','torrei','dei','tive','fiz','foi','foram','deu','custou','vendi']);
const IN_W = /(^|\s)(recebi|ganhei|entrou|caiu|vendi|rendeu|reembolso|reembolsaram|estorno|salario|pro-labore|pro labore|prolabore|dividendos?|cashback|entrada de)(\s|$)/;
const EDGE_W = new Set(['no','na','nos','nas','em','de','do','da','dos','das','com','um','uma','pra','para','pro','o','a','os','as','e','que','eu','agora','mais','valor','por','pelo','pela','via','meu','minha','ai','la','ja','so','tipo','reais','real','centavos','e o','numa','num','uns','umas','sobre','referente','ref']);
const SEP_W = new Set([',',';','e','mais','+','tambem','depois']);

function parseNumTok(s){
  s=s.replace(/^r\$/,'');
  if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s)) return parseFloat(s.replace(/\./g,'').replace(',','.'));
  if(/^\d+,\d{1,2}$/.test(s)) return parseFloat(s.replace(',','.'));
  if(/^\d+\.\d{1,2}$/.test(s)) return parseFloat(s);
  if(/^\d{1,3}(,\d{3})+$/.test(s)) return parseFloat(s.replace(/,/g,''));
  if(/^\d+$/.test(s)) return parseInt(s,10);
  return NaN;
}
function tokenize(text){
  let t=String(text||'').replace(/[“”"]/g,' ').replace(/R\$\s*/gi,' r$ ').replace(/(\d)\s*(k)\b/gi,'$1000')
    .replace(/[!?;]+/g,' , ').replace(/,(?!\d)/g,' , ').replace(/\.(?!\d)/g,' ').replace(/\s+/g,' ').trim();
  return t ? t.split(' ').map(o=>({o,n:norm(o)})) : [];
}
function wordsToNums(toks){
  const out=[];let i=0;
  while(i<toks.length){
    const w=toks[i].n;
    if((w in NUMW)||w==='mil'){
      if((w==='um'||w==='uma') && !(toks[i+1] && ['mil','real','reais','conto'].includes(toks[i+1].n))){out.push(toks[i]);i++;continue}
      let total=0,cur=0,last=Infinity,j=i;
      while(j<toks.length){
        const t=toks[j].n;
        if(t==='mil'){cur=(cur||1)*1000;total+=cur;cur=0;last=1000;j++;continue}
        if(t in NUMW){const v=NUMW[t];if(v>=last)break;cur+=v;last=v;j++;continue}
        if(t==='e'&&toks[j+1]&&(toks[j+1].n in NUMW)&&NUMW[toks[j+1].n]<last){j++;continue}
        break;
      }
      const v=total+cur; out.push({o:String(v),n:String(v)}); i=j;
    } else {out.push(toks[i]);i++}
  }
  return out;
}
function markNums(toks){
  // converte tokens numéricos, junta "X reais e Y centavos", "X e YY", marca moeda
  const out=[];
  for(let i=0;i<toks.length;i++){
    const tk={...toks[i]};
    if(tk.n==='r$'){ const nx=toks[i+1]; if(nx && !isNaN(parseNumTok(nx.n))){ out.push({o:nx.o,n:nx.n,num:parseNumTok(nx.n),cur:true}); i++; continue } }
    const v=/^r?\$?\d/.test(tk.n)?parseNumTok(tk.n):NaN;
    if(!isNaN(v)){ tk.num=v; out.push(tk); continue }
    out.push(tk);
  }
  // reais/centavos
  const res=[];
  for(let i=0;i<out.length;i++){
    const t=out[i];
    if(t.num!==undefined){
      let j=i+1, cur=t.cur||false, val=t.num;
      if(out[j] && CUR_W.has(out[j].n)){cur=true;j++}
      // "e 90 centavos" ou "com 90"
      if(out[j] && (out[j].n==='e'||out[j].n==='com') && out[j+1] && out[j+1].num!==undefined && out[j+1].num<100 && Number.isInteger(out[j+1].num)){
        const after=out[j+2];
        if((after && /^centavos?$/.test(after.n)) || (cur && (!after || !CUR_W.has(after.n))) || (!cur && /^\d{2}$/.test(out[j+1].n) && Number.isInteger(val) && (!after || after.num===undefined))){
          val=val+out[j+1].num/100; j+=2; if(out[j] && /^centavos?$/.test(out[j].n)) j++;
        }
      } else if(out[j] && /^centavos?$/.test(out[j].n) && !cur){ val=val/100; cur=true; j++ }
      res.push({o:t.o,n:t.n,num:Math.round(val*100)/100,cur}); i=j-1; continue;
    }
    res.push(t);
  }
  return res;
}
function splitSegments(toks){
  const chunks=[]; let cur=[]; const seps=[];
  for(const t of toks){ if(SEP_W.has(t.n)&&t.num===undefined){ chunks.push(cur); seps.push(t); cur=[] } else cur.push(t) }
  chunks.push(cur);
  const segs=[]; let acc=[]; let accHas=false;
  chunks.forEach((ch,k)=>{
    const has=ch.some(t=>t.num!==undefined && !t.isDate);
    if(k>0){
      if(accHas && has){ segs.push(acc); acc=[...ch]; accHas=true; return }
      if(acc.length) acc.push(seps[k-1]);
    }
    acc.push(...ch); accHas=accHas||has;
  });
  if(acc.length) segs.push(acc);
  return segs;
}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseUtterance(text,opts){
  const scope=opts.scope||'pessoal', today=opts.today?new Date(opts.today+'T12:00:00'):new Date();
  let toks=markNums(wordsToNums(tokenize(text)));
  // datas "dia 12"
  let globalDate=null;
  toks=toks.filter((t,i,a)=>{
    if(t.n==='dia' && a[i+1] && a[i+1].num!==undefined && a[i+1].num>=1 && a[i+1].num<=31 && Number.isInteger(a[i+1].num)){a[i+1].isDate=true;return false}
    return true;
  });
  const segs=splitSegments(toks);
  const items=[];
  for(const seg of segs){
    const ntext=seg.map(t=>t.n).join(' ');
    let type = IN_W.test(' '+ntext+' ') ? 'in':'out';
    let pay=null, date=null;
    const nums=seg.filter(t=>t.num!==undefined && !t.isDate);
    const dTok=seg.find(t=>t.isDate);
    if(dTok){const d=new Date(today);if(dTok.num>today.getDate())d.setMonth(d.getMonth()-1);d.setDate(dTok.num);date=ymd(d)}
    let amount=0;
    const curN=nums.filter(t=>t.cur);
    if(curN.length) amount=curN[curN.length-1].num; else if(nums.length) amount=Math.max(...nums.map(t=>t.num));
    const keep=[];
    for(let i=0;i<seg.length;i++){
      const t=seg[i];
      if(t.num!==undefined||t.isDate) continue;
      if(CUR_W.has(t.n)||/^centavos?$/.test(t.n)) continue;
      if(t.n in PAY_W){ pay=pay||PAY_W[t.n]; if(t.n==='cartao' && seg[i+1] && seg[i+2] && seg[i+1].n==='de' && (seg[i+2].n in PAY_W)){pay=PAY_W[seg[i+2].n];i+=2} continue }
      if(t.n in DATE_W){ const d=new Date(today); d.setDate(d.getDate()+DATE_W[t.n]); date=date||ymd(d); continue }
      if(VERB_W.has(t.n)) continue;
      keep.push(t);
    }
    while(keep.length && (EDGE_W.has(keep[0].n)||SEP_W.has(keep[0].n))) keep.shift();
    while(keep.length && (EDGE_W.has(keep[keep.length-1].n)||SEP_W.has(keep[keep.length-1].n))) keep.pop();
    let desc=keep.map(t=>t.o).join(' ').replace(/\s+,/g,',').replace(/^[,\s]+|[,\s]+$/g,'');
    if(desc && !/^[a-z][A-Z]/.test(desc)) desc=desc.charAt(0).toUpperCase()+desc.slice(1);
    const cl = classify(desc||ntext,scope,type,opts.learned);
    if(!desc) desc = catOf(scope,type,cl.id).n;
    items.push({amount,desc,type,cat:cl.id,sure:cl.sure,date,pay:pay||'',raw:seg.map(t=>t.o).join(' ')});
  }
  // "ontem" ou "no pix" ditos uma vez valem para todos os itens da frase
  const dates=[...new Set(items.map(i=>i.date).filter(Boolean))], pays=[...new Set(items.map(i=>i.pay).filter(Boolean))];
  items.forEach(i=>{ if(!i.date) i.date=dates.length===1?dates[0]:ymd(today); if(!i.pay&&pays.length===1) i.pay=pays[0] });
  return items.filter(i=>i.amount>0 || i.desc);
}

async function authReq(path,body){
  const r=await fetch(CL.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:CL.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));

function traduzErro(m){
  const s=String(m).toLowerCase();
  if(s.includes('invalid login')) return 'E-mail ou senha incorretos.';
  if(s.includes('email not confirmed')) return 'Confirme o e-mail que o Supabase enviou e tente entrar de novo.';
  if(s.includes('already registered')) return 'Este e-mail já tem conta. Use Entrar.';
  if(s.includes('password')&&s.includes('6')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(s.includes('failed to fetch')||s.includes('network')) return 'Sem conexão com o Supabase. Confira o endereço do projeto e a internet.';

}

async function api(method,path,body,extra){
  if(CL.session.exp-Date.now()<60000) await clRefresh();
  const go=()=>fetch(CL.url+'/rest/v1/'+path,{method,headers:{apikey:CL.key,Authorization:'Bearer '+CL.session.access,'Content-Type':'application/json',...(extra||{})},body:body?JSON.stringify(body):undefined});
  let r=await go(); if(r.status===401){ await clRefresh(); r=await go() }
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error(t||('Erro '+r.status)) }
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}
function markDirty(id){ CL.dirty.add(id); clSave(); schedulePush() }
function schedulePush(){ if(!clReady()) return; clearTimeout(CL.pt); CL.pt=setTimeout(syncNow,700) }
async function syncNow(){
  if(!clReady()) return; if(CL.busy){ CL.again=true; return } CL.busy=true; CL.again=false;
  if(S.sync!=='ok') setSync('wait');
  try{
    const firstSync=!CL.last;
    // envia o que mudou neste aparelho
    const ids=[...CL.dirty];
    for(let i=0;i<ids.length;i+=200){
      const batch=ids.slice(i,i+200).map(id=>{ const r=id==='settings'?S.settings:S.recs.get(id); return r?{id,data:JSON.parse(JSON.stringify(r)),deleted:false}:{id,data:{id},deleted:true} });
      await api('POST','aconta_records?on_conflict=user_id,id',batch,{Prefer:'resolution=merge-duplicates,return=minimal'});
      batch.forEach(b=>CL.dirty.delete(b.id)); clSave();
    }
    // recebe o que mudou nos outros aparelhos
    // volta 15 s no tempo para não perder alterações gravadas ao mesmo tempo em outro aparelho
    const back=t=>{ const ms=Date.parse(String(t).replace(/(\.\d{3})\d+/,'$1')); return isNaN(ms)?t:new Date(ms-15000).toISOString() };
    let since=CL.last?back(CL.last):'', changed=false;
    for(let page=0;page<50;page++){
      const q='aconta_records?select=id,data,deleted,updated_at&order=updated_at.asc&limit=1000'+(since?'&updated_at=gt.'+encodeURIComponent(since):'');
      const rows=await api('GET',q);
      if(!rows||!rows.length) break;
      for(const row of rows){
        if(CL.dirty.has(row.id)) continue;
        if(row.id==='settings'){ if(!row.deleted && JSON.stringify(row.data)!==JSON.stringify(S.settings)){ S.settings={budgets:{},learned:{},...row.data,id:'settings',kind:'settings'}; changed=true } }
        else if(row.deleted){ if(S.recs.has(row.id)){ S.recs.delete(row.id); changed=true } }
        else { const cur=S.recs.get(row.id); if(!cur||JSON.stringify(cur)!==JSON.stringify({...row.data,id:row.id})){ S.recs.set(row.id,{...row.data,id:row.id}); changed=true } }
      }
      since=rows[rows.length-1].updated_at; CL.last=since; clSave();
      if(rows.length<1000) break;
    }
    if(firstSync&&!CL.last) CL.last='1970-01-01T00:00:00Z';
    if(changed){ saveLocal(); render() }
    setSync('ok');
  }catch(e){ console.warn('sync',e); if(S.sync!=='login') setSync('stale') }
  finally{ CL.busy=false; if(CL.again||CL.dirty.size&&S.sync==='ok') schedulePush() }
}

function genInst(total,n,first){
  n=Math.max(1,Math.min(48,n|0)); const base=Math.floor(total/n*100)/100; const out=[];
  const [y,mm,d]=first.split('-').map(Number);
  for(let k=0;k<n;k++){ const dt=new Date(y,mm-1+k,1); const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(); dt.setDate(Math.min(d,last));
    out.push({n:k+1,due:ymd(dt),amount:k===n-1?Math.round((total-base*(n-1))*100)/100:base,paidAt:''}) }
  return out;
}

// ---- gráfico de barras duplas (6 meses) ----
function monthsChart(series,W=640){
  const months=[...Array(6)].map((_,i)=>addMonth(S.month,i-5));
  const H=W<500?220:230,L=46,R=8,T=12,B=28; const iw=W-L-R, ih=H-T-B;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=niceStep(max/4); const top=Math.ceil(max/step)*step;
  const y=v=>T+ih-(v/top)*ih; const gw=iw/6; const bw=Math.min(26,(gw-18)/2);
  let g='';
  for(let v=0;v<=top+1e-6;v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(140,190,255,${v===0?.28:.08})"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${brlK(v)}</text>` }
  months.forEach((m,i)=>{
    const cx=L+gw*i+gw/2;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="${m===S.month?'fill:var(--ink)':''}">${MES3[+m.slice(5)-1]}</text>`;
    series.forEach((s,k)=>{ const v=s.values[i]; const x=cx-bw-1+k*(bw+2); const h=Math.max(0,ih-(y(v)-T)); const r=Math.min(4,h);
      const d=h>0?`M${x},${T+ih} V${T+ih-h+r} Q${x},${T+ih-h} ${x+r},${T+ih-h} H${x+bw-r} Q${x+bw},${T+ih-h} ${x+bw},${T+ih-h+r} V${T+ih} Z`:'';
      g+=`<path class="bar-mark" d="${d}" fill="${s.color}" opacity="${m===S.month?1:.75}"/>`;
      g+=`<rect class="bar-hit" x="${x-2}" y="${T}" width="${bw+4}" height="${ih}" data-tip="${esc(s.name+' · '+mLabel(m)+'\n'+brl(v))}"/>`;
    });
  });
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(' e ')+' nos últimos 6 meses')}">${g}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1)))); const f=x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p }
function catBars(rows,scope,type,{budgets,act}={}){
  if(!rows.length) return `<div class="empty">Nenhum gasto neste mês ainda.</div>`;
  const tot=sumBy(rows,r=>r.v)||1;
  const max=Math.max(...rows.map(r=>Math.max(r.v,budgets&&budgets[r.id]||0)));

    return `<button class="cbar" data-act="${act||'filtercat'}" data-cat="${r.id}" data-tip="${esc(c.n+'\n'+brl(r.v)+' · '+(r.v/tot*100).toFixed(1)+'% do total'+(lim?'\nLimite: '+brl(lim)+' ('+(ratio*100).toFixed(0)+'% usado)':'')+(r.n?'\n'+r.n+' lançamento'+(r.n>1?'s':''):''))}"><span class="hex ${type==='in'?'in':''}">${c.ab}</span><span class="cn">${esc(c.n)}</span><span class="track"><i class="${cls}" style="width:${(r.v/max*100).toFixed(1)}%"></i>${lim?`<b class="lim" style="left:calc(${(lim/max*100).toFixed(1)}% - 1px)"></b>`:''}</span><span class="cv mono">${brl(r.v)}</span><span class="cp mono">${(r.v/tot*100).toFixed(0)}%</span></button>` }).join('')}</div>`;
}

  const exp=txs('negocios'); const expM=sumBy(exp.filter(x=>x.type==='out'&&x.date.startsWith(m))); const othIn=sumBy(exp.filter(x=>x.type==='in'&&x.date.startsWith(m)));
  const res=recM+othIn-expM;
  const margin=soldV?(soldV-sumBy(sold,s=>s.cost||0))/soldV*100:0;
  const months=[...Array(6)].map((_,i)=>addMonth(m,i-5));
  const series=[{name:'Recebido',color:'var(--in)',values:months.map(mm=>sumBy(paid.filter(p=>p.x.paidAt.startsWith(mm)),p=>p.x.amount)+sumBy(exp.filter(x=>x.type==='in'&&x.date.startsWith(mm))))},{name:'Despesas',color:'var(--out)',values:months.map(mm=>sumBy(exp.filter(x=>x.type==='out'&&x.date.startsWith(mm))))}];
  // top clientes 12 meses
  const from=addMonth(m,-11); const tc={}; act.filter(s=>s.date.slice(0,7)>=from&&s.date.slice(0,7)<=m).forEach(s=>{tc[s.clientId]=(tc[s.clientId]||0)+s.total});
  const tcl=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5); const tmax=tcl.length?tcl[0][1]:1;
  const byType={produto:0,projeto:0,servico:0}; sold.forEach(s=>(s.items||[]).forEach(i=>byType[i.type||'produto']+=i.qty*i.price));
  const ecats=groupCat(exp.filter(x=>x.type==='out'&&x.date.startsWith(m)));
  return head('Negócios','Painel da empresa',`${sold.length} venda${sold.length===1?'':'s'} fechada${sold.length===1?'':'s'} em ${mLabel(m)}`,`<button class="btn sm" data-act="prolabore">Retirar pró-labore</button><button class="btn pri sm" data-act="new-sale"><svg width="16" height="16" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nova venda</button>`)+
  `<div class="grid g4">${tile('Resultado do mês',brl(res),res>=0?'<span class="pill good">lucro</span><span>recebido − despesas</span>':'<span class="pill crit">prejuízo</span><span>recebido − despesas</span>',true)}${tile('Vendido',brl(soldV),soldV?`<span class="pill acc">margem ${margin.toFixed(0)}%</span><span>sobre custo dos itens</span>`:'<span>nenhuma venda fechada</span>')}${tile('Recebido',brl(recM+othIn),`${paid.filter(p=>p.x.paidAt.startsWith(m)).length} parcelas recebidas`)}${tile('A receber',brl(openV),late.length?`<span class="pill crit">${late.length} vencida${late.length>1?'s':''}</span><span>${brl(sumBy(late,p=>p.x.amount))}</span>`:'<span class="pill good">em dia</span>')}</div>`+
  `<div class="grid g32"><div class="panel hud"><div class="ph"><h2>Caixa · 6 meses</h2><span class="sub">regime de caixa</span></div>${monthsChart(series)}</div>`+
  `<div class="panel"><div class="ph"><h2>Próximos recebimentos</h2><button class="btn sm ghost" data-act="tab" data-tab="receber">Ver todos</button></div>${open.length?`<div class="rows">${open.slice(0,5).map(instRow).join('')}</div>`:'<div class="empty">Nada pendente.</div>'}</div></div>`+
  `<div class="grid g2"><div class="panel"><div class="ph"><h2>Melhores clientes</h2><span class="sub">12 meses</span></div>${tcl.length?`<div class="cbars">${tcl.map(([id,v])=>`<button class="cbar" style="grid-template-columns:minmax(110px,190px) 1fr auto" data-act="client" data-id="${id}" data-tip="${esc(clientName(id)+'\n'+brl(v)+' vendidos')}"><span class="cn">${esc(clientName(id))}</span><span class="track"><i style="width:${(v/tmax*100).toFixed(1)}%"></i></span><span class="cv mono">${brl(v)}</span></button>`).join('')}</div>`:'<div class="empty">Sem vendas no período.</div>'}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${Object.entries(byType).map(([k,v])=>`<span class="pill">${PTYPE[k]} <b class="mono" style="color:var(--ink)">${brl(v)}</b></span>`).join('')}</div></div>`+
  `<div class="panel"><div class="ph"><h2>Despesas por categoria</h2><button class="btn sm ghost" data-act="tab" data-tab="despesas">Ver todas</button></div>${catBars(ecats.slice(0,7),'negocios','out',{act:'filtercat'})}</div></div>`;
}
function instRow({s,x,k}){
  const t=todayStr(); const late=x.due<t; const soon=!late&&x.due<=ymd(new Date(Date.now()+7*864e5));
  return `<div class="row"><span class="hex in">${String(x.n).padStart(2,'0')}</span><span class="rmain"><span class="rt">${esc(clientName(s.clientId))}</span><span class="rs">${late?'<b style="color:var(--crit)">vencida</b> · ':soon?'<b style="color:var(--warn)">em breve</b> · ':''}${dmy(x.due)} · ${x.n}/${s.installments.length} · ${esc(saleTitle(s))}</span></span><span class="ramt mono">${brl(x.amount)}</span><button class="btn sm" data-act="pay" data-id="${s.id}" data-k="${k}" aria-label="Marcar como recebido"><svg width="15" height="15" viewBox="0 0 24 24"><use href="#i-check"/></svg>Recebi</button></div>`;
}

// ---- vendas ----
function vVendas(){
  const q=norm(S.csearch); let list=all('sale').filter(s=>s.date.startsWith(S.month)||(s.installments||[]).some(x=>!x.paidAt)&&ACTIVE(s)&&s.date<=S.month+'-31');
  if(q) list=all('sale').filter(s=>norm(clientName(s.clientId)+' '+(s.items||[]).map(i=>i.name).join(' ')).includes(q));
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const inMonth=list.filter(s=>s.date.startsWith(S.month)&&ACTIVE(s));
  return head('Negócios','Vendas',`${brl(sumBy(inMonth,s=>s.total))} fechados em ${mLabel(S.month)} · mostrando também vendas com parcelas em aberto`,`<button class="btn pri sm" data-act="new-sale"><svg width="16" height="16" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nova venda</button>`)+
  `<div class="toolbar"><input class="inp search" id="c-q" placeholder="Buscar cliente ou item em todas as vendas…" value="${esc(S.csearch)}"></div>`+
  (list.length?`<div class="cards">${list.map(saleCard).join('')}</div>`:'<div class="empty">Nenhuma venda. Cadastre itens no Catálogo e registre a primeira venda.</div>');
}
function saleCard(s){
  const inst=s.installments||[]; const pd=sumBy(inst.filter(x=>x.paidAt),x=>x.amount); const st=STATUS[s.status]||STATUS.fechada;
  return `<button class="card" data-act="edit-sale" data-id="${s.id}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="pill ${st[1]}">${st[0]}</span><span class="meta mono">${dmy(s.date)}</span></div><h3>${esc(clientName(s.clientId))}</h3><div class="meta">${esc((s.items||[]).map(i=>(i.qty>1?i.qty+'× ':'')+i.name).join(' · '))}</div><div class="kv"><span>Total</span><b class="mono">${brl(s.total)}</b></div><div class="prog"><i style="width:${s.total?Math.min(100,pd/s.total*100):0}%"></i></div><div class="kv"><span>Recebido ${brl(pd)}</span><span class="mono">${inst.filter(x=>x.paidAt).length}/${inst.length} parcelas</span></div></button>`;
}
function vReceber(){
  const open=openInst(); const t=todayStr(); const lim=ymd(new Date(Date.now()+30*864e5));
  const g=[['Vencidas',open.filter(p=>p.x.due<t)],['Próximos 30 dias',open.filter(p=>p.x.due>=t&&p.x.due<=lim)],['Depois',open.filter(p=>p.x.due>lim)]];
  const rec=paidInst().filter(p=>p.x.paidAt.startsWith(S.month)).sort((a,b)=>b.x.paidAt.localeCompare(a.x.paidAt));
  return head('Negócios','Contas a receber',`${brl(sumBy(open,p=>p.x.amount))} em aberto em ${open.length} parcela${open.length===1?'':'s'}`)+
  g.filter(([,a])=>a.length).map(([n,a])=>`<div class="panel ${n==='Vencidas'?'':'hud'}"><div class="ph"><h2>${n}</h2><span class="sub">${brl(sumBy(a,p=>p.x.amount))}</span></div><div class="rows">${a.map(instRow).join('')}</div></div>`).join('')+
  (open.length?'':'<div class="empty">Tudo recebido. Nenhuma parcela em aberto.</div>')+
  `<div class="panel"><div class="ph"><h2>Recebidos em ${mLabel(S.month)}</h2><span class="sub">${brl(sumBy(rec,p=>p.x.amount))}</span></div>${rec.length?`<div class="rows">${rec.map(({s,x,k})=>`<div class="row"><span class="hex in">${String(x.n).padStart(2,'0')}</span><span class="rmain"><span class="rt">${esc(clientName(s.clientId))}</span><span class="rs">${esc(saleTitle(s))} · recebido ${dmy(x.paidAt)}</span></span><span class="ramt mono in">+ ${brl(x.amount)}</span><button class="btn sm ghost" data-act="unpay" data-id="${s.id}" data-k="${k}">Desfazer</button></div>`).join('')}</div>`:'<div class="empty">Nenhum recebimento neste mês.</div>'}</div>`;
}
function clientStats(id){ const ss=all('sale').filter(s=>s.clientId===id&&ACTIVE(s)); const tot=sumBy(ss,s=>s.total); const op=sumBy(ss.flatMap(s=>(s.installments||[]).filter(x=>!x.paidAt)),x=>x.amount); return {ss,tot,op} }
function vClientes(){
  const q=norm(S.csearch); let list=all('client'); if(q) list=list.filter(c=>norm(c.name+' '+c.email+' '+c.phone+' '+c.city).includes(q));

  `<div class="toolbar"><input class="inp search" id="c-q" placeholder="Buscar cliente…" value="${esc(S.csearch)}"></div>`+

function vCatalogo(){
  const list=all('product').sort((a,b)=>a.name.localeCompare(b.name));

  (list.length?`<div class="panel"><div class="rows">${list.map(p=>{const mg=p.price?(p.price-(p.cost||0))/p.price*100:0;return `<button class="row" data-act="edit-product" data-id="${p.id}"><span class="hex">${(PTYPE[p.type]||'P').slice(0,2).toUpperCase()}</span><span class="rmain"><span class="rt">${esc(p.name)}</span><span class="rs">${PTYPE[p.type]||'Produto'} · custo ${brl(p.cost)}</span></span><span class="pill ${mg>=50?'good':mg>=25?'':'warn'}">margem ${mg.toFixed(0)}%</span><span class="ramt mono">${brl(p.price)}</span></button>`}).join('')}</div></div>`:'<div class="empty">Cadastre o que você vende para agilizar as vendas.</div>');

let MS={};
function modal(title,body,{foot='',wide=false,onSubmit,onOpen}={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="scrim" data-scrim><form class="sheet ${wide?'wide':''}" id="mf" novalidate><div class="sh"><h2>${title}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div><div class="sb">${body}</div>${foot?`<div class="sf">${foot}</div>`:''}</form></div>`;
  const f=$('#mf'); f.addEventListener('submit',e=>{e.preventDefault(); if(onSubmit&&onSubmit(new FormData(f))!==false) closeModal()});
  root.querySelector('[data-scrim]').addEventListener('mousedown',e=>{ if(e.target.matches('[data-scrim]')) closeModal() });
  onOpen&&onOpen(f);
}
function closeModal(){ if(S.voiceOpen) stopVoice(); $('#modal-root').innerHTML=''; MS={} }
function confirmBox(msg,yes,onYes){ modal('Confirmar',`<p style="margin:0;color:var(--ink2)">${msg}</p>`,{foot:`<div class="r"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn danger">${yes}</button></div>`,onSubmit:()=>{onYes()}}) }
const num=v=>{ v=String(v||'').trim(); if(!v) return 0; const p=parseNumTok(norm(v).replace(/\s/g,'').replace(/^r\$/,'')); return isNaN(p)?(parseFloat(v.replace(',','.'))||0):p };
const moneyIn=v=>v?String(v.toFixed?v.toFixed(2):v).replace('.',','):'';

function txForm(t){
  const isNew=!t.id; const scopes=`<div class="tseg"><label><input type="radio" name="scope" value="pessoal" ${t.scope==='pessoal'?'checked':''}><span>Pessoal</span></label><label><input type="radio" name="scope" value="negocios" ${t.scope==='negocios'?'checked':''}><span>Empresa</span></label></div>`;
  const body=`<div class="tseg"><label><input type="radio" name="type" value="out" ${t.type==='out'?'checked':''}><span>Saída</span></label><label><input type="radio" name="type" value="in" ${t.type==='in'?'checked':''}><span>Entrada</span></label></div>
  <div class="field"><label for="tx-amt">Valor (R$)</label><input class="inp mono big-amt" id="tx-amt" name="amount" inputmode="decimal" required placeholder="0,00" value="${moneyIn(t.amount)}"></div>
  <div class="fgrid"><div class="field full"><label for="tx-desc">Descrição</label><input class="inp" id="tx-desc" name="desc" placeholder="Ex.: Padaria" value="${esc(t.desc||'')}"></div>
  <div class="field"><label for="tx-cat">Categoria</label><select class="inp" id="tx-cat" name="cat"></select></div>
  <div class="field"><label for="tx-date">Data</label><input class="inp mono" type="date" id="tx-date" name="date" value="${t.date||todayStr()}"></div>
  <div class="field"><label for="tx-pay">Pagamento</label><select class="inp" id="tx-pay" name="pay"><option value="">—</option>${Object.entries(PAY).map(([k,l])=>`<option value="${k}" ${t.pay===k?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="field"><label>Área</label>${scopes}</div></div>`;
  modal(isNew?'Novo lançamento':'Editar lançamento',body,{
    foot:`${isNew?'':'<button type="button" class="btn danger" data-act="del-tx" data-id="'+t.id+'">Excluir</button>'}<div class="r"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri">Salvar</button></div>`,
    onOpen:f=>{ const fill=()=>{ const sc=f.scope.value, ty=f.type.value; const cur=f.cat.value||t.cat; $('#tx-cat').innerHTML=catList(sc,ty).map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.n)}</option>`).join('') }; fill();
      f.addEventListener('change',e=>{ if(e.target.name==='type'||e.target.name==='scope'){ f.cat.value=''; fill(); autoCat() } });
      const autoCat=()=>{ const d=f.desc.value; if(!d) return; const r=classify(d,f.scope.value,f.type.value,S.settings.learned); if(r.sure) f.cat.value=r.id };
      if(isNew){ f.desc.addEventListener('input',autoCat); setTimeout(()=>f.amount.focus(),60) } },
    onSubmit:fd=>{
      const amount=num(fd.get('amount')); if(!amount){ toast('Informe um valor.'); return false }
      const rec={...t,kind:'tx',type:fd.get('type'),scope:fd.get('scope'),amount,desc:String(fd.get('desc')||'').trim()||catOf(fd.get('scope'),fd.get('type'),fd.get('cat')).n,cat:fd.get('cat'),date:fd.get('date')||todayStr(),pay:fd.get('pay')||'',id:t.id||uid(),createdAt:t.createdAt||Date.now(),src:t.src||'manual'};
      // aprende: se o usuário trocou a categoria sugerida
      const auto=classify(rec.desc,rec.scope,rec.type,null);
      if(rec.cat!==auto.id || (t.id && t.cat!==rec.cat)){ S.settings.learned[learnKey(rec.scope,rec.type,rec.desc)]=rec.cat; putSettings() }
      if(isDemo()&&rec.id.startsWith('demo')) rec.id=uid();
      put(rec); toast(isNew?'Lançamento salvo.':'Lançamento atualizado.');
    }});
}

function saleForm(s){
  const isNew=!s.id;
  MS={items:(s.items||[]).map(i=>({...i}))}; if(!MS.items.length) MS.items=[{pid:'',name:'',type:'produto',qty:1,price:0,cost:0}];

// iPhone (app): reconhecimento de fala nativo do iOS · PC: Chrome/Edge · resto: microfone do teclado
let VOICE=null, webRec=null, natLast='', silT=null, natListener=false;
function getSR(){ const C=window.Capacitor; if(!C) return null; return (C.Plugins&&C.Plugins.SpeechRecognition)||(C.registerPlugin?C.registerPlugin('SpeechRecognition'):null) }
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function initVoice(){
  if(isNative()&&getSR()){ VOICE='native'; return }
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R) return;
  try{
    webRec=new R(); webRec.lang='pt-BR'; webRec.interimResults=true; webRec.continuous=true; webRec.maxAlternatives=1;
    webRec.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal){ const t=r[0].transcript.trim(); if(t&&S.voiceOpen) voiceFinal(t) } else interim+=r[0].transcript } if(interim&&S.voiceOpen) voicePartial(interim) };
    webRec.onstart=()=>{ S.listening=true; voiceState() };
    webRec.onend=()=>{ S.listening=false; voiceState(); if(S.voiceOpen&&S.wantListen){ try{ webRec.start() }catch(e){} } };
    webRec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){ S.wantListen=false; VOICE=null; const v=$('#vtext'); if(v) v.textContent='Microfone bloqueado. Libere nas permissões do navegador ou digite abaixo.' } };
    VOICE='web';
  }catch(e){ VOICE=null }
}
function voiceStart(){
  S.wantListen=true;
  if(VOICE==='web'){ try{ webRec.start() }catch(e){} return }
  if(VOICE==='native') nativeStart().catch(e=>{ S.wantListen=false; S.listening=false; voiceState(); const v=$('#vtext'); if(v) v.textContent=(e&&e.code==='not_granted')?'Libere Microfone e Reconhecimento de Fala em Ajustes do iPhone › Aconta.':'Não consegui ouvir. Toque no orbe para tentar de novo.' });
}
function voiceStop(){
  S.wantListen=false;
  if(VOICE==='web'){ try{ webRec.stop() }catch(e){} }
  else if(VOICE==='native'){ clearTimeout(silT); const t=natLast.trim(); natLast=''; const SR=getSR(); if(SR) SR.stop().catch(()=>{}); S.listening=false; voiceState(); if(t&&S.voiceOpen) voiceFinal(t) }
}
async function nativeStart(){
  const SR=getSR();
  let p=await SR.checkPermissions().catch(()=>null);
  if(!p||p.speechRecognition!=='granted'){ p=await SR.requestPermissions(); if(!p||p.speechRecognition!=='granted') throw {code:'not_granted'} }
  if(!natListener){ natListener=true; await SR.addListener('partialResults',d=>{ const t=((d&&d.matches)||[])[0]||''; if(!t||!S.voiceOpen) return; natLast=t; voicePartial(t); clearTimeout(silT); silT=setTimeout(nativeFinalize,1500) }) }
  natLast=''; S.listening=true; voiceState(); voicePartial('Ouvindo… diga o valor e o que foi.');
  await SR.start({language:'pt-BR',maxResults:1,partialResults:true,popup:false});
  clearTimeout(silT); silT=setTimeout(nativeFinalize,9000);
}
async function nativeFinalize(){
  clearTimeout(silT); const t=natLast.trim(); natLast='';
  try{ await getSR().stop() }catch(e){}
  S.listening=false; voiceState();
  if(t&&S.voiceOpen){ voiceFinal(t); if(S.wantListen) setTimeout(()=>{ if(S.voiceOpen&&S.wantListen) nativeStart().catch(()=>{}) },600) }
  else if(S.voiceOpen){ S.wantListen=false; const v=$('#vtext'); if(v){ v.textContent='Toque no orbe para falar.'; v.classList.add('partial') } }
}
function openVoice(){
  S.voiceOpen=false; closeModal();
  const scope=S.mode; const hasV=!!VOICE;
  modal(scope==='pessoal'?'Lançar por voz':'Despesa da empresa por voz',`<div class="vstage"><div class="vorb" id="vorb"><span class="ring"></span><span class="ring"></span><span class="ring"></span><button type="button" class="core" data-act="vtoggle" aria-label="Ouvir"><svg width="38" height="38" viewBox="0 0 24 24"><use href="#i-mic"/></svg></button></div>
  <div class="vtext partial" id="vtext">${hasV?'Ouvindo… diga o valor e o que foi.':'Toque no campo e fale pelo microfone do teclado'}</div>
  <input class="inp big-amt" id="vin" name="vin" autocomplete="off" enterkeyhint="send" placeholder="${hasV?'ou digite aqui':'45 padaria no pix'}" style="text-align:center;font-size:20px!important">
  ${hasV?'':`<div class="vhint">Toque no <b>microfone do teclado</b> e diga: “gastei 45 reais na padaria”. Depois toque em Enviar.</div>`}
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${(scope==='pessoal'?['32 uber','45,90 farmácia no pix','ontem 120 mercado e 18 padaria','recebi 3500 freela']:['1200 meta ads','650 contador no pix','89 frete correios']).map(x=>`<span class="ex">${x}</span>`).join('')}</div>
  <div class="vres" id="vres"></div></div>`,{
    foot:`<span class="sync" style="align-self:center">${scope==='pessoal'?'Área: Pessoal':'Área: Empresa'}</span><div class="r"><button type="button" class="btn ghost" data-act="close">Concluir</button><button class="btn pri">Lançar</button></div>`,

function stopVoice(){ S.voiceOpen=false; voiceStop() }
function voiceState(){ const o=$('#vorb'); if(o) o.classList.toggle('on',!!S.listening) }
function voicePartial(text){ const v=$('#vtext'); if(v){ v.textContent=text; v.classList.add('partial') } }
function voiceFinal(text){ const v=$('#vtext'); if(v){ v.textContent='“'+text+'”'; v.classList.remove('partial') } handleUtterance(text,'voz') }
function handleUtterance(text,src){
  const scope=S.mode;
  const items=parseUtterance(text,{scope,today:todayStr(),learned:S.settings.learned}).filter(i=>i.amount>0);

  const vr=$('#vres');
  if(vr && S.voiceOpen){ vr.insertAdjacentHTML('afterbegin',recs.map(r=>{const c=catOf(r.scope,r.type,r.cat);return `<div class="vitem" id="vi-${r.id}"><span class="hex ${r.type==='in'?'in':''}">${c.ab}</span><span class="rmain"><span class="rt">${esc(r.desc)}</span><span class="rs">${esc(c.n)}${r.pay?' · '+PAY[r.pay]:''}${r.date!==todayStr()?' · '+dmy(r.date):''}</span></span><span class="ramt mono ${r.type}">${r.type==='in'?'+':'−'} ${brl(r.amount)}</span><button type="button" class="btn sm ghost" data-act="edit-tx" data-id="${r.id}">Editar</button></div>`}).join('')) }
  else toast(recs.length===1?`${recs[0].desc} · ${brl(recs[0].amount)} → ${catOf(scope,recs[0].type,recs[0].cat).n}`:`${recs.length} lançamentos salvos · ${brl(sumBy(recs))}`,'Desfazer',()=>{recs.forEach(r=>del(r.id))});
}

function toast(msg,actLabel,act){
  const el=document.createElement('div'); el.className='t'; el.innerHTML=`<span>${esc(msg)}</span>${actLabel?`<button type="button">${esc(actLabel)}</button>`:''}`;
  if(actLabel) el.querySelector('button').onclick=()=>{act();el.remove()};
  $('#toast').appendChild(el); setTimeout(()=>el.remove(),actLabel?6000:3200);
  while($('#toast').children.length>3) $('#toast').firstChild.remove();
}
const tip=$('#tip');
function showTip(e,el){ tip.textContent=el.dataset.tip; tip.style.display='block'; const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+14, y=e.clientY-h-12; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y<8) y=e.clientY+18; tip.style.left=x+'px'; tip.style.top=y+'px' }
document.addEventListener('pointermove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el&&e.pointerType==='mouse') showTip(e,el); else if(e.pointerType==='mouse') tip.style.display='none' });
document.addEventListener('pointerdown',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el&&e.pointerType!=='mouse'){ showTip(e,el); setTimeout(()=>tip.style.display='none',2200) } else tip.style.display='none' });

  'new-tx':el=>txForm({type:el.dataset.type||'out',scope:S.mode,date:S.month===todayStr().slice(0,7)?todayStr():S.month+'-01',cat:DEF_CAT[S.mode][el.dataset.type||'out']}),
  'edit-tx':el=>{ const t=byId(el.dataset.id)||S.recs.get(el.dataset.id); if(!t) return; if(t.demo){ toast('Este é um lançamento de exemplo. Crie o seu com o orbe ou o botão Novo.'); return } txForm({...t}) },
  'del-tx':el=>{ const t=S.recs.get(el.dataset.id); confirmBox(`Excluir “${esc(t?t.desc:'')}”?`,'Excluir',()=>{ del(el.dataset.id); if(t&&t.linkId){ for(const r of [...S.recs.values()]) if(r.linkId===t.linkId&&r.id!==t.id) del(r.id) } toast('Lançamento excluído.') }) },
  filtercat:el=>{ const scope=S.mode; const cat=el.dataset.cat; S.tabs[scope]=scope==='pessoal'?'lanc':'despesas'; S.filt={q:'',type:'all',cat}; render(); $('#scroll').scrollTop=0 },
  'clear-filt':()=>{ S.filt={q:'',type:'all',cat:''}; render() },
  'new-client':()=>clientForm({}),
  'edit-client':el=>{ const c=byId(el.dataset.id); if(c&&c.demo){ toast('Cliente de exemplo. Cadastre os seus em + Cliente.'); return } c&&clientForm({...c}) },
  client:el=>clientDetail(el.dataset.id),
  'del-client':el=>{ const n=all('sale').filter(s=>s.clientId===el.dataset.id).length; confirmBox(n?`Este cliente tem ${n} venda(s). Elas continuam salvas como “Cliente avulso”. Excluir mesmo assim?`:'Excluir este cliente?','Excluir',()=>{ del(el.dataset.id); toast('Cliente excluído.') }) },
  'new-product':()=>productForm({}),
  'edit-product':el=>{ const p=byId(el.dataset.id); if(p&&p.demo){ toast('Item de exemplo. Cadastre os seus em + Item.'); return } p&&productForm({...p}) },
  'del-product':el=>confirmBox('Excluir este item do catálogo? As vendas já feitas não mudam.','Excluir',()=>{ del(el.dataset.id); toast('Item excluído.') }),
  'new-sale':el=>saleForm({clientId:el.dataset.client||'',date:todayStr(),status:'fechada'}),
  'edit-sale':el=>{ const s=byId(el.dataset.id); if(s&&s.demo){ toast('Venda de exemplo. Registre as suas em Nova venda.'); return } s&&saleForm(JSON.parse(JSON.stringify(s))) },
  'del-sale':el=>confirmBox('Excluir esta venda e suas parcelas?','Excluir',()=>{ del(el.dataset.id); toast('Venda excluída.') }),
  'sl-add':()=>{ MS.items.push({pid:'',name:'',type:'produto',qty:1,price:0,cost:0}); renderSaleItems() },
  'sl-rm':el=>{ MS.items.splice(+el.dataset.i,1); if(!MS.items.length) MS.items.push({pid:'',name:'',type:'produto',qty:1,price:0,cost:0}); renderSaleItems() },
  pay:el=>{ const s=byId(el.dataset.id); if(s&&s.demo){ toast('Parcela de exemplo. Suas vendas reais aparecem aqui.'); return } const k=+el.dataset.k; const rec=JSON.parse(JSON.stringify(s)); rec.installments[k].paidAt=todayStr(); if(rec.installments.every(x=>x.paidAt)&&rec.status==='fechada') rec.status='entregue'; put(rec); toast(`Recebido ${brl(rec.installments[k].amount)} de ${clientName(rec.clientId)}.`,'Desfazer',()=>{ const r2=JSON.parse(JSON.stringify(S.recs.get(rec.id))); r2.installments[k].paidAt=''; put(r2) }) },
  unpay:el=>{ const s=byId(el.dataset.id); if(s&&s.demo) return; const rec=JSON.parse(JSON.stringify(s)); rec.installments[+el.dataset.k].paidAt=''; put(rec) },
  prolabore:()=>{
    modal('Retirar pró-labore',`<p style="margin:0;color:var(--ink2);font-size:14px">Lança a saída na empresa e a entrada nas suas finanças pessoais, ligadas entre si.</p><div class="field"><label for="pl-v">Valor (R$)</label><input class="inp mono big-amt" id="pl-v" name="v" inputmode="decimal" required></div><div class="field"><label for="pl-d">Data</label><input class="inp mono" type="date" id="pl-d" name="d" value="${todayStr()}"></div>`,{foot:`<div class="r"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri">Lançar nos dois</button></div>`,onOpen:()=>setTimeout(()=>$('#pl-v').focus(),60),
      onSubmit:fd=>{ const v=num(fd.get('v')); if(!v){toast('Informe o valor.');return false} const link=uid(); const d=fd.get('d')||todayStr(); const now=Date.now();
        put({id:uid()+'a',kind:'tx',scope:'negocios',type:'out',amount:v,desc:'Pró-labore',cat:'prolabore_n',date:d,pay:'transf',src:'manual',linkId:link,createdAt:now});
        put({id:uid()+'b',kind:'tx',scope:'pessoal',type:'in',amount:v,desc:'Pró-labore',cat:'prolabore',date:d,pay:'transf',src:'manual',linkId:link,createdAt:now}); toast('Pró-labore lançado na empresa e no pessoal.') }});
  },
  'copy-csv':()=>{ const t=csv(); navigator.clipboard.writeText(t).then(()=>toast('Planilha copiada. Cole no Excel ou Google Planilhas.')).catch(()=>{ modal('Copiar planilha',`<textarea class="inp mono" rows="12" readonly>${esc(t)}</textarea>`,{}) }) }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=A[el.dataset.act]; if(f){ e.preventDefault(); f(el) } });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){ S.filt.q=t.value; rerenderKeep('f-q') }
  else if(t.id==='c-q'){ S.csearch=t.value; rerenderKeep('c-q') }
  else if(t.dataset&&t.dataset.f&&MS.items){ const it=MS.items[+t.dataset.i]; const f=t.dataset.f; if(f==='name') it.name=t.value; else if(f!=='pid') it[f]=num(t.value); saleTotal() }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-type'){ S.filt.type=t.value; render() }
  else if(t.id==='f-cat'){ S.filt.cat=t.value; render() }
  else if(t.dataset&&t.dataset.lim){ const v=num(t.value); if(v) S.settings.budgets[t.dataset.lim]=v; else delete S.settings.budgets[t.dataset.lim]; putSettings(); render(); toast(v?'Limite salvo.':'Limite removido.') }
  else if(t.dataset&&t.dataset.f==='pid'&&MS.items){ const it=MS.items[+t.dataset.i]; const p=byId(t.value); if(p){ Object.assign(it,{pid:p.id,name:p.name,type:p.type,price:p.price,cost:p.cost||0}) } else Object.assign(it,{pid:'',name:''}); renderSaleItems() }
});
function rerenderKeep(id){ const el=document.getElementById(id); const pos=el?el.selectionStart:null; render(); const n=document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos) }catch(e){} } }
$('#cmd').addEventListener('submit',e=>{ e.preventDefault(); const v=$('#cmd-in').value.trim(); if(!v) return; handleUtterance(v,'texto'); $('#cmd-in').value='' });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#modal-root').innerHTML) closeModal(); if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&innerWidth>960){ e.preventDefault(); $('#cmd-in').focus() } });

// ================= INÍCIO =================
async function clAuth(create){
  const e=$('#cl-email').value.trim(), p=$('#cl-pw').value, m=$('#cl-msg');
  if(!e||!p){ m.textContent='Preencha e-mail e senha.'; return }
  m.style.color='var(--ink2)'; m.textContent=create?'Criando conta…':'Entrando…';
  try{ const r=await clLogin(e,p,create); if(r==='confirm'){ m.style.color='var(--warn)'; m.textContent='Conta criada. Abra o e-mail de confirmação do Supabase e depois toque em Entrar.'; return } toast('Conectado. Sincronizando seus dados.'); settingsModal() }
  catch(err){ m.style.color='var(--warn)'; m.textContent=err.message }
}
loadLocal(); initCloud();
</script>
